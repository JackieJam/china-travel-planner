<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国交通旅游地图</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css?v=20260608-1">
  <!-- 配置（API Key 等） -->
  <script src="js/config.js?v=20260605-1"></script>
  <!-- 高德地图 JS API 2.0（key 从 config.js 读取） -->
  <script>
    (function() {
      function fail(message) {
        window.AMAP_BOOT_ERROR = message;
        window.dispatchEvent(new CustomEvent('amap-error', { detail: { message: message } }));
        document.addEventListener('DOMContentLoaded', function() {
          var el = document.getElementById('status-text');
          if (el) el.textContent = message;
        });
      }

      var key = (window.APP_CONFIG && window.APP_CONFIG.amapKey) || '';
      if (!key || key === 'YOUR_AMAP_KEY_HERE') {
        fail('缺少高德 API Key，请在 js/config.js 中配置');
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + key + '&plugin=AMap.PlaceSearch,AMap.AutoComplete';
      s.onload = function() { window.dispatchEvent(new Event('amap-ready')); };
      s.onerror = function() {
        fail('高德地图 API 加载失败，请检查网络或 Key');
      };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- 加载遮罩 -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-card">
        <div class="loading-spinner"></div>
        <div id="loading-text" class="loading-text">加载地图中...</div>
        <div class="loading-progress">
          <div id="loading-progress-fill" class="loading-progress-fill"></div>
        </div>
      </div>
    </div>

    <div id="map-progress" class="map-progress hidden">
      <span id="map-progress-text">地图渲染中...</span>
      <div class="map-progress-track">
        <div id="map-progress-fill" class="map-progress-fill"></div>
      </div>
    </div>
    <!-- 移动端汉堡按钮 -->
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="切换侧边栏">
      <span class="hamburger"></span>
    </button>

    <!-- 侧边栏遮罩 -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- 左侧控制面板 -->
    <aside id="sidebar">
      <header class="sidebar-header">
        <h1>交通旅游地图</h1>
        <span class="subtitle">高铁 · 地铁 · 景点</span>
      </header>

      <!-- 路线查询 -->
      <section class="panel route-search-panel">
        <h2 class="panel-title">路线查询</h2>
        <div class="route-search-form">
          <div class="route-input-group">
            <span class="route-icon start">出</span>
            <input type="text" id="route-from" class="route-input" placeholder="出发城市" autocomplete="off">
            <div id="route-from-suggestions" class="route-suggestions hidden"></div>
          </div>
          <button id="route-swap" class="route-swap-btn" title="交换起终点">⇅</button>
          <div class="route-input-group">
            <span class="route-icon end">到</span>
            <input type="text" id="route-to" class="route-input" placeholder="到达城市" autocomplete="off">
            <div id="route-to-suggestions" class="route-suggestions hidden"></div>
          </div>
          <button id="route-search-btn" class="route-search-btn">路线参考</button>
        </div>
      </section>

      <!-- 图层开关 -->
      <section class="panel">
        <h2 class="panel-title">图层</h2>
        <div class="layer-toggles">
          <label class="toggle-item active" data-layer="hsr">
            <span class="toggle-dot" style="background:#e74c3c"></span>
            <span class="toggle-label">高铁线路</span>
            <input type="checkbox" checked data-layer-toggle="hsr">
          </label>
          <label class="toggle-item" data-layer="metro">
            <span class="toggle-dot" style="background:#3498db"></span>
            <span class="toggle-label">地铁线路</span>
            <input type="checkbox" data-layer-toggle="metro">
          </label>
          <label class="toggle-item" data-layer="spots">
            <span class="toggle-dot" style="background:#2ecc71"></span>
            <span class="toggle-label">著名景点</span>
            <input type="checkbox" data-layer-toggle="spots">
          </label>
        </div>
      </section>

      <!-- 线路筛选 -->
      <section class="panel">
        <h2 class="panel-title">线路筛选</h2>
        <div class="line-filters">
          <label class="filter-chip active" data-filter="G">
            <span class="filter-dot" style="background:#E63946"></span>高铁 G
          </label>
          <label class="filter-chip active" data-filter="D">
            <span class="filter-dot" style="background:#457B9D"></span>动车 D
          </label>
          <label class="filter-chip active" data-filter="C">
            <span class="filter-dot" style="background:#2A9D8F"></span>城际 C
          </label>
          <label class="filter-chip active" data-filter="K">
            <span class="filter-dot" style="background:#A0522D"></span>快速 K
          </label>
        </div>
      </section>

      <!-- 搜索 -->
      <section class="panel">
        <h2 class="panel-title">搜索城市</h2>
        <div class="search-box">
          <input type="text" id="city-search" placeholder="输入城市名…" autocomplete="off">
          <div id="search-results" class="search-results hidden"></div>
        </div>
      </section>

      <!-- 快捷城市 -->
      <section class="panel">
        <h2 class="panel-title">热门城市</h2>
        <div id="quick-cities" class="city-chips"></div>
      </section>

      <!-- 城市列表 -->
      <section class="panel panel-scroll">
        <h2 class="panel-title">全部城市 <span id="city-count" class="badge"></span></h2>
        <ul id="city-list" class="city-list"></ul>
      </section>
    </aside>

    <!-- 地图容器 -->
    <main id="map-container"></main>

    <!-- 地图左上角：站点 hover 的出发城市选择 -->
    <div id="origin-control" class="origin-control">
      <label for="origin-city-select">出发城市</label>
      <select id="origin-city-select">
        <option value="">选择城市</option>
      </select>
    </div>

    <div id="station-route-tooltip" class="station-route-tooltip hidden"></div>

    <!-- 右侧详情面板 -->
    <div id="detail-panel" class="detail-panel hidden">
      <button id="detail-close" class="detail-close" title="关闭">×</button>
      <div id="detail-content"></div>
    </div>

    <!-- 纯净地图模式切换 -->
    <button id="map-mode-toggle" class="map-mode-toggle" title="切换纯净地图模式">纯净模式</button>

    <!-- 取消车次高亮按钮 -->
    <button id="clear-highlight-btn" class="clear-highlight-btn hidden" title="取消车次高亮">
      <span class="clear-icon">✕</span> 取消车次高亮
    </button>

    <!-- 底部状态栏 -->
    <footer id="status-bar" class="status-bar">
      <span id="status-text">就绪</span>
      <span id="data-freshness" class="data-freshness"></span>
      <span id="zoom-level">缩放: -</span>
    </footer>
  </div>

  <script src="js/app.js?v=20260608-1"></script>
</body>
</html>
